<title>Dublín de bolsillo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one-screen phone app. Header, scrolling view, bottom tab bar. Category colours borrowed from Georgian doors. */
:root {
  --bg: #EDF1F2;
  --surface: #FFFFFF;
  --surface-2: #E3E9EB;
  --ink: #14212A;
  --muted: #566A75;
  --line: #CFD9DD;
  --accent: #17664E;
  --accent-soft: #D6EBE3;
  --on-accent: #FFFFFF;
  --toast-act: #7FE0B8;
  --warn: #A55A00;
  --warn-soft: #FBEBD3;
  --bad: #B0302A;
  --bad-soft: #F7DEDC;
  --good: #1F7A45;
  --c-ver: #B5372B;
  --c-museo: #2A5A9C;
  --c-calle: #B07B0C;
  --c-parque: #3B8A4E;
  --c-comer: #8A4BA6;
  --c-pub: #6A4528;
  --water: #A9CBDD;
  --park: #CFE3C8;
  --street: #FFFFFF;
  --street-edge: #C8D2D6;
  --campus: #E2E2D6;
  --f-display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E161B; --surface: #172229; --surface-2: #1F2D35; --ink: #E4ECEF; --muted: #95A8B2; --line: #2C3D46;
    --accent: #4DBB91; --accent-soft: #173B30; --on-accent: #06140F; --toast-act: #0F5A43;
    --warn: #F0A646; --warn-soft: #3A2A12; --bad: #F07A70; --bad-soft: #3D1C1A; --good: #5CCB86;
    --c-ver: #EE7A6C; --c-museo: #7EA8E8; --c-calle: #E2B045; --c-parque: #6FC283; --c-comer: #C38BDE; --c-pub: #C79A72;
    --water: #1D4559; --park: #1D3326; --street: #34454E; --street-edge: #22323A; --campus: #252F2B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E161B; --surface: #172229; --surface-2: #1F2D35; --ink: #E4ECEF; --muted: #95A8B2; --line: #2C3D46;
  --accent: #4DBB91; --accent-soft: #173B30; --on-accent: #06140F; --toast-act: #0F5A43;
  --warn: #F0A646; --warn-soft: #3A2A12; --bad: #F07A70; --bad-soft: #3D1C1A; --good: #5CCB86;
  --c-ver: #EE7A6C; --c-museo: #7EA8E8; --c-calle: #E2B045; --c-parque: #6FC283; --c-comer: #C38BDE; --c-pub: #C79A72;
  --water: #1D4559; --park: #1D3326; --street: #34454E; --street-edge: #22323A; --campus: #252F2B;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 var(--f-body);
  display: flex; flex-direction: column; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px 10px; display: flex; align-items: center; gap: 12px; }
.brand { flex: 1; min-width: 0; }
.brand h1 { margin: 0; font: 800 21px/1.05 var(--f-display); letter-spacing: -0.01em; }
.brand small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.netpill { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 4px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.netpill.on { background: var(--accent-soft); color: var(--accent); }

main { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; -webkit-overflow-scrolling: touch; }
.view { padding-block: 14px 28px; }
.view[hidden] { display: none !important; }

/* Bottom tabs */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs button { background: none; border: 0; padding: 8px 4px 9px; display: grid; justify-items: center; gap: 2px; color: var(--muted); font-size: 12px; font-weight: 600; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-selected="true"] { color: var(--accent); }

/* Common bits */
.h2 { font: 800 19px/1.15 var(--f-display); margin: 0 0 8px; text-wrap: balance; }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 10px; font-weight: 600; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { padding: 5px 9px; font-size: 13px; }
.btn svg { width: 16px; height: 16px; flex: none; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 6px 11px; border-radius: 99px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); padding: 3px; border-radius: 11px; gap: 3px; }
.seg button { border: 0; background: none; padding: 7px 6px; border-radius: 8px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.banner { background: var(--warn-soft); color: var(--ink); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; margin-bottom: 14px; }
.banner b { color: var(--warn); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
.pill.good { background: var(--accent-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.neutral { background: var(--surface-2); color: var(--muted); }
.district { font: 700 11px/1 var(--f-body); letter-spacing: .04em; border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; color: var(--muted); }

/* Explore */
.search { position: relative; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 40px 12px 40px; font-size: 16px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; padding: 8px; color: var(--muted); font-size: 18px; line-height: 1; }
.explore-tools { display: grid; gap: 10px; margin-bottom: 12px; }
.refline { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.refline select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 6px; font-size: 13px; font-weight: 600; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid; grid-template-columns: 4px 1fr auto; overflow: hidden; }
.item .bar { background: var(--c); }
.item-main { padding: 10px 10px 10px 12px; min-width: 0; background: none; border: 0; text-align: left; }
.item-name { font-weight: 700; font-size: 15.5px; line-height: 1.25; }
.item-meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.item-side { display: grid; align-content: center; justify-items: end; gap: 5px; padding: 8px 10px 8px 0; }
.walk { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.add { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 20px; line-height: 1; font-weight: 600; display: grid; place-items: center; padding: 0; }
.add.in { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-size: 12px; font-weight: 800; width: auto; padding: 0 8px; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }

/* Detail sheet */
.sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet[hidden] { display: none !important; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding-block: 8px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet-head .x { border: 0; background: var(--surface-2); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; padding: 0; flex: none; }
.sheet-head .x svg { width: 20px; height: 20px; }
.sheet-body { flex: 1; overflow-y: auto; padding-block: 16px 30px; display: flex; flex-direction: column; gap: 16px; }
.sheet-body > * { flex-shrink: 0; }
.d-cat { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); font-weight: 600; }
.d-title { font: 800 26px/1.08 var(--f-display); margin: 4px 0 0; letter-spacing: -0.01em; text-wrap: balance; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.facts div { background: var(--surface); padding: 9px 10px; min-width: 0; }
.facts b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.facts small { display: block; font-size: 11.5px; margin-top: 1px; }
.facts span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.prose { margin: 0; max-width: 65ch; }
.tipbox { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; }
.addrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.addrow .btn { justify-content: center; }
.addrow .btn.in { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.links { display: grid; gap: 8px; }
.links a { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; text-decoration: none; color: var(--ink); font-weight: 600; }
.links a small { color: var(--muted); font-weight: 500; }
.near { display: grid; gap: 6px; }
.near button { display: flex; align-items: center; gap: 8px; border: 0; background: var(--surface); border-radius: 10px; padding: 9px 10px; text-align: left; }
.near button span.n { flex: 1; font-weight: 600; min-width: 0; }

/* Plan */
.plan-head { display: grid; gap: 10px; margin-bottom: 12px; }
.day-note { font-size: 13.5px; color: var(--muted); margin: 0; }
.settings { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.settings label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 700; }
.settings input[type="time"], .settings select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 8px; font-size: 15px; font-weight: 600; color: var(--ink); width: 100%; }
.settings .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); font-weight: 600; grid-column: 1 / -1; }
.settings .check input { width: 20px; height: 20px; accent-color: var(--accent); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.actions .btn { padding: 7px 10px; font-size: 13.5px; }
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl::before { content: ""; position: absolute; left: 17px; top: 14px; bottom: 14px; width: 2px; background: var(--line); }
.tl li { position: relative; }
.tl-node { display: flex; gap: 12px; align-items: center; padding: 6px 0; }
.tl-node .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 800; flex: none; z-index: 1; }
.tl-node time, .tl-stop time { font-variant-numeric: tabular-nums; font-weight: 800; }
.tl-walk { padding: 2px 0 2px 48px; font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; min-height: 26px; flex-wrap: wrap; }
.tl-walk svg { width: 14px; height: 14px; }
.tl-walk .far { color: var(--warn); font-weight: 700; }
.tl-sun { padding: 4px 0 4px 48px; font-size: 12.5px; font-weight: 700; color: var(--warn); display: flex; align-items: center; gap: 6px; }
.tl-sun::before { content: ""; position: absolute; left: 12px; width: 12px; height: 12px; border-radius: 50%; background: var(--warn); }
.tl-stop { display: grid; grid-template-columns: 36px 1fr; gap: 12px; padding: 4px 0; }
.tl-stop .num { width: 36px; height: 36px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 800; z-index: 1; border: 3px solid var(--bg); }
.tl-stop.done .num { background: var(--muted); }
.tl-stop.done .card { opacity: .6; }
.tl-stop.done .sname { text-decoration: line-through; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.card .r1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.sname { font-weight: 700; font-size: 15.5px; background: none; border: 0; padding: 0; text-align: left; line-height: 1.25; }
.ctrl { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.ctrl button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; min-width: 32px; height: 32px; padding: 0 6px; font-weight: 700; display: grid; place-items: center; }
.ctrl button svg { width: 16px; height: 16px; }
.ctrl .durv { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 46px; text-align: center; }
.ctrl .sp { flex: 1; }
.ctrl button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.totals { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; text-align: center; }
.totals b { display: block; font: 800 19px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.totals span { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.limitmsg { margin-top: 8px; }
.tpl { display: grid; gap: 8px; margin-top: 8px; }
.tpl-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 4px; }
.tpl-item p { margin: 0; font-size: 13.5px; color: var(--muted); }
details.box > summary { cursor: pointer; font-weight: 700; padding: 10px 0; list-style: none; display: flex; align-items: center; gap: 8px; }
details.box > summary::-webkit-details-marker { display: none; }
details.box > summary::before { content: "+"; width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; font-weight: 800; }
details.box[open] > summary::before { content: "−"; }
textarea { width: 100%; min-height: 80px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px; font-size: 15px; resize: vertical; }

/* Map */
#view-map { position: absolute; inset: 0; padding: 0; }
#map { width: 100%; height: 100%; display: block; touch-action: none; background: var(--bg); user-select: none; -webkit-user-select: none; }
#map .river { fill: none; stroke: var(--water); stroke-linecap: round; stroke-linejoin: round; }
#map .canal { fill: none; stroke: var(--water); stroke-width: 3px; vector-effect: non-scaling-stroke; }
#map .park { fill: var(--park); }
#map .campus { fill: var(--campus); }
#map .st-edge { fill: none; stroke: var(--street-edge); stroke-width: 7px; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
#map .st { fill: none; stroke: var(--street); stroke-width: 5px; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
#map .route { fill: none; stroke: var(--ink); stroke-width: 3px; vector-effect: non-scaling-stroke; stroke-dasharray: 6 5; stroke-linejoin: round; }
#map .mk circle { stroke: var(--surface); stroke-width: 2px; }
#map .mk circle.hit { stroke: none; fill: transparent; }
#map .mk text, #map .lbl text { font: 700 11px var(--f-body); fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
#map .mk .num { fill: #fff; stroke: none; font-size: 11px; font-weight: 800; }
#map .lbl text { font-size: 10px; font-weight: 600; fill: var(--muted); letter-spacing: .03em; }
#map .lbl.water text { fill: var(--water); stroke: var(--bg); font-style: italic; font-size: 12px; }
#map .mk .name { display: none; }
#map.labels .mk .name, #map .mk.stop .name, #map .mk.sel .name { display: inline; }
#map .mk.dim { opacity: .35; }
#map .mk.sel circle { stroke: var(--ink); stroke-width: 3px; }
.mapbar { position: absolute; top: 10px; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.mapbar > * { pointer-events: auto; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
.mapbtns { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 14px; display: grid; gap: 6px; }
.mapbtns button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 22px; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.15); padding: 0; }
.mapbtns svg { width: 20px; height: 20px; }
.mapcard { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); right: 64px; bottom: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
.mapcard .t { font-weight: 800; font-size: 15.5px; }
.mapnote { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 14px; font-size: 11px; color: var(--muted); background: var(--surface); padding: 3px 7px; border-radius: 6px; opacity: .9; }

/* Info */
.info { display: grid; gap: 18px; max-width: 720px; }
.info section { display: grid; gap: 8px; }
.info p, .info ul { margin: 0; }
.info ul { padding-left: 18px; display: grid; gap: 4px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.kv dt { font-weight: 700; font-variant-numeric: tabular-nums; }
.kv dd { margin: 0; color: var(--muted); }
.trip { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 3px; text-decoration: none; color: var(--ink); }
.trip b { display: flex; justify-content: space-between; gap: 8px; }
.trip span { font-size: 13.5px; color: var(--muted); }
.hotelpick { display: grid; gap: 8px; }
.hotelpick label { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.hotelpick input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); }
.hotelpick small { display: block; color: var(--muted); }

.toast { position: fixed; left: 0; right: 0; margin-inline: auto; width: fit-content; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; display: flex; gap: 14px; align-items: center; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.toast span { min-width: 0; }
.toast button { flex: none; background: none; border: 0; color: var(--toast-act); font-weight: 800; padding: 0; }
@media (prefers-reduced-motion: no-preference) {
  .sheet:not([hidden]) { animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(16px); opacity: .6; } to { transform: none; opacity: 1; } }
}
@media (min-width: 760px) {
  .list { grid-template-columns: 1fr 1fr; }
  .view.gutter, .sheet-body { padding-left: max(24px, calc((100% - 900px) / 2)); padding-right: max(24px, calc((100% - 900px) / 2)); }
}
</style>

<header class="top gutter">
  <div class="brand">
    <h1>Dublín de bolsillo</h1>
    <small id="sub">Jue 5 – Sáb 7 de noviembre</small>
  </div>
  <span class="netpill" id="net">Sin conexión</span>
</header>

<main id="main">
  <section class="view gutter" id="view-explore" aria-label="Explorar">
    <div id="hotel-banner"></div>
    <div class="explore-tools">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar: castillo, pinta, gratis, lluvia…" autocomplete="off" enterkeyhint="search">
        <button class="clear" id="q-clear" aria-label="Borrar búsqueda" hidden>×</button>
      </div>
      <div class="chips" id="cats"></div>
      <div class="refline">
        <span>Distancias desde</span>
        <select id="ref" aria-label="Medir distancias desde">
          <option value="hotel">el hotel</option>
          <option value="gps">mi posición (GPS)</option>
          <option value="last">la última parada del plan</option>
        </select>
        <span>Ordenar</span>
        <select id="sort" aria-label="Ordenar">
          <option value="rel">por interés</option>
          <option value="near">por cercanía</option>
        </select>
      </div>
    </div>
    <ul class="list" id="list"></ul>
  </section>

  <section class="view" id="view-map" aria-label="Mapa" hidden>
    <svg id="map" role="img" aria-label="Mapa esquemático del centro de Dublín"></svg>
    <div class="mapbar">
      <div class="seg" id="mapmode" style="grid-auto-columns:auto"></div>
    </div>
    <div class="mapnote" id="mapnote">Mapa esquemático · sin escala exacta de calles</div>
    <div class="mapcard" id="mapcard" hidden></div>
    <div class="mapbtns">
      <button id="zin" aria-label="Acercar">+</button>
      <button id="zout" aria-label="Alejar">−</button>
      <button id="zhotel" aria-label="Centrar en el hotel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9H3z"/><path d="M10 20v-5h4v5"/></svg></button>
      <button id="zgps" aria-label="Mi posición"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    </div>
  </section>

  <section class="view gutter" id="view-plan" aria-label="Plan" hidden></section>
  <section class="view gutter" id="view-info" aria-label="Info" hidden></section>
</main>

<nav class="tabs" id="tabs" aria-label="Secciones">
  <button data-tab="explore" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Explorar</button>
  <button data-tab="map" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Mapa</button>
  <button data-tab="plan" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5"/></svg>Plan</button>
  <button data-tab="info" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Info</button>
</nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="d-title">
  <div class="sheet-head gutter">
    <button class="x" id="sheet-close" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5 8 12l7 7"/></svg></button>
    <span class="label" id="sheet-label"></span>
  </div>
  <div class="sheet-body gutter" id="sheet-body"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/*__DATA__*/
</script>
<script>

</script>
