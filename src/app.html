<title>Dublín de bolsillo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one-screen phone app. Header, scrolling view, bottom tab bar. Category colours borrowed from Georgian doors. */
:root {
  --bg: #EDF1F2;
  --surface: #FFFFFF;
  --surface-2: #E3E9EB;
  --ink: #14212A;
  --muted: #566A75;
  --line: #CFD9DD;
  --accent: #17664E;
  --accent-soft: #D6EBE3;
  --on-accent: #FFFFFF;
  --toast-act: #7FE0B8;
  --warn: #A55A00;
  --warn-soft: #FBEBD3;
  --bad: #B0302A;
  --bad-soft: #F7DEDC;
  --good: #1F7A45;
  --c-ver: #B5372B;
  --c-museo: #2A5A9C;
  --c-calle: #B07B0C;
  --c-parque: #3B8A4E;
  --c-comer: #8A4BA6;
  --c-pub: #6A4528;
  --water: #A9CBDD;
  --water-ink: #3C7397;
  --park: #CDE5C3;
  --land: #F2F1EC;
  --street: #FFFFFF;
  --street-edge: #CBCBC4;
  --road-sec: #FBE3A0;
  --road-sec-edge: #D9B860;
  --road-ped: #EBD3E0;
  --tram: #8B4FA6;
  --route: #1E5FD0;
  --campus: #E2E2D6;
  --f-display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 14px;
  --k: 1.07;
}
:root.big { --k: 1.22; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E161B; --surface: #172229; --surface-2: #1F2D35; --ink: #E4ECEF; --muted: #95A8B2; --line: #2C3D46;
    --accent: #4DBB91; --accent-soft: #173B30; --on-accent: #06140F; --toast-act: #0F5A43;
    --warn: #F0A646; --warn-soft: #3A2A12; --bad: #F07A70; --bad-soft: #3D1C1A; --good: #5CCB86;
    --c-ver: #EE7A6C; --c-museo: #7EA8E8; --c-calle: #E2B045; --c-parque: #6FC283; --c-comer: #C38BDE; --c-pub: #C79A72;
    --water: #24546D; --water-ink: #8CC0DE; --park: #1C3427; --land: #10181C; --street: #3A4A53; --street-edge: #1A252B; --road-sec: #6B5C2E; --road-sec-edge: #2E2814; --road-ped: #3F3A45; --tram: #C08BDE; --route: #6FA4FF; --campus: #252F2B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E161B; --surface: #172229; --surface-2: #1F2D35; --ink: #E4ECEF; --muted: #95A8B2; --line: #2C3D46;
  --accent: #4DBB91; --accent-soft: #173B30; --on-accent: #06140F; --toast-act: #0F5A43;
  --warn: #F0A646; --warn-soft: #3A2A12; --bad: #F07A70; --bad-soft: #3D1C1A; --good: #5CCB86;
  --c-ver: #EE7A6C; --c-museo: #7EA8E8; --c-calle: #E2B045; --c-parque: #6FC283; --c-comer: #C38BDE; --c-pub: #C79A72;
  --water: #24546D; --water-ink: #8CC0DE; --park: #1C3427; --land: #10181C; --street: #3A4A53; --street-edge: #1A252B; --road-sec: #6B5C2E; --road-sec-edge: #2E2814; --road-ped: #3F3A45; --tram: #C08BDE; --route: #6FA4FF; --campus: #252F2B;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: calc(15px * var(--k))/1.45 var(--f-body);
  display: flex; flex-direction: column; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px 10px; display: flex; align-items: center; gap: 12px; }
.brand { flex: 1; min-width: 0; }
.brand h1 { margin: 0; font: 800 21px/1.05 var(--f-display); letter-spacing: -0.01em; }
.brand small { display: block; color: var(--muted); font-size: calc(12px * var(--k)); margin-top: 2px; }
.netpill { font-size: calc(11px * var(--k)); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 4px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.netpill.on { background: var(--accent-soft); color: var(--accent); }

main { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; -webkit-overflow-scrolling: touch; }
.view { padding-block: 14px 28px; }
.view[hidden] { display: none !important; }

/* Bottom tabs */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs button { background: none; border: 0; padding: 8px 4px 9px; display: grid; justify-items: center; gap: 2px; color: var(--muted); font-size: calc(12px * var(--k)); font-weight: 600; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button { min-height: 56px; }
.tabs button[aria-selected="true"] { color: var(--accent); }

/* Common bits */
.h2 { font: 800 calc(19px * var(--k))/1.15 var(--f-display); margin: 0 0 8px; text-wrap: balance; }
.label { font-size: calc(11px * var(--k)); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 10px; font-weight: 600; font-size: calc(14px * var(--k)); display: inline-flex; gap: 6px; align-items: center; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { padding: 5px 9px; font-size: calc(13px * var(--k)); }
.btn svg { width: 16px; height: 16px; flex: none; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 6px 11px; border-radius: 99px; font-size: calc(13px * var(--k)); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); padding: 3px; border-radius: 11px; gap: 3px; }
.seg button { border: 0; background: none; padding: 7px 6px; border-radius: 8px; font-weight: 700; font-size: calc(14px * var(--k)); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.banner { background: var(--warn-soft); color: var(--ink); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; margin-bottom: 14px; }
.banner b { color: var(--warn); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: calc(12px * var(--k)); font-weight: 700; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
.pill.good { background: var(--accent-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.neutral { background: var(--surface-2); color: var(--muted); }
.district { font: 700 calc(11px * var(--k))/1 var(--f-body); letter-spacing: .04em; border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; color: var(--muted); }

/* Explore */
.search { position: relative; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 40px 12px 40px; font-size: calc(16px * var(--k)); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; padding: 8px; color: var(--muted); font-size: calc(18px * var(--k)); line-height: 1; }
.explore-tools { display: grid; gap: 10px; margin-bottom: 12px; }
.refline { font-size: calc(13px * var(--k)); color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.refline select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 6px; font-size: calc(13px * var(--k)); font-weight: 600; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid; grid-template-columns: 4px 1fr auto; overflow: hidden; }
.item .bar { background: var(--c); }
.item-main { padding: 10px 10px 10px 12px; min-width: 0; background: none; border: 0; text-align: left; }
.item-name { font-weight: 700; font-size: calc(15.5px * var(--k)); line-height: 1.25; }
.item-meta { font-size: calc(12.5px * var(--k)); color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.item-side { display: grid; align-content: center; justify-items: end; gap: 5px; padding: 8px 10px 8px 0; }
.walk { font-size: calc(12.5px * var(--k)); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.add { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: calc(20px * var(--k)); line-height: 1; font-weight: 600; display: grid; place-items: center; padding: 0; }
.add svg { width: 20px; height: 20px; }
.add.in { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-size: calc(13px * var(--k)); font-weight: 800; width: auto; padding: 0 9px; gap: 3px; display: inline-flex; }
.add.in svg { width: 15px; height: 15px; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }

/* Detail sheet */
.sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet[hidden] { display: none !important; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding-block: 8px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet-head .x { border: 0; background: var(--surface-2); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; padding: 0; flex: none; }
.sheet-head .x svg { width: 20px; height: 20px; }
.sheet-body { flex: 1; overflow-y: auto; padding-block: 16px 30px; display: flex; flex-direction: column; gap: 16px; }
.sheet-body > * { flex-shrink: 0; }
.d-cat { display: flex; gap: 8px; align-items: center; font-size: calc(13px * var(--k)); color: var(--muted); font-weight: 600; }
.d-title { font: 800 calc(26px * var(--k))/1.08 var(--f-display); margin: 4px 0 0; letter-spacing: -0.01em; text-wrap: balance; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.facts div { background: var(--surface); padding: 9px 10px; min-width: 0; }
.facts b { display: block; font-size: calc(15px * var(--k)); font-variant-numeric: tabular-nums; }
.facts small { display: block; font-size: calc(11.5px * var(--k)); margin-top: 1px; }
.facts span { font-size: calc(11px * var(--k)); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.prose { margin: 0; max-width: 65ch; }
.tipbox { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; }
.addrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.addrow .btn { justify-content: center; }
.addrow .btn.in { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.links { display: grid; gap: 8px; }
.links a { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; text-decoration: none; color: var(--ink); font-weight: 600; }
.links a small { color: var(--muted); font-weight: 500; }
.near { display: grid; gap: 6px; }
.near button { display: flex; align-items: center; gap: 8px; border: 0; background: var(--surface); border-radius: 10px; padding: 9px 10px; text-align: left; }
.near button span.n { flex: 1; font-weight: 600; min-width: 0; }

/* Map */
#view-map { position: absolute; inset: 0; padding: 0; }
#map { width: 100%; height: 100%; display: block; touch-action: none; background: var(--land); user-select: none; -webkit-user-select: none; }
#map .river { fill: none; stroke: var(--water); stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
#map .canal { fill: none; stroke: var(--water); vector-effect: non-scaling-stroke; stroke-linecap: round; }
#map .park { fill: var(--park); }
#map .rd-edge, #map .rd { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
#map .rd-edge { stroke: var(--street-edge); }
#map .rd { stroke: var(--street); }
#map .rd-sec { stroke: var(--road-sec); }
#map .rd-major { stroke: var(--road-sec); }
#map .rd-ped { stroke: var(--road-ped); }
#map .rd-foot { stroke: var(--road-ped); }
#map .rd-edge.rd-foot { stroke: none; }
#map .rd-edge.rd-sec, #map .rd-edge.rd-major { stroke: var(--road-sec-edge); }
#map .tram { fill: none; stroke: var(--tram); stroke-width: 2px; stroke-dasharray: 7 4; vector-effect: non-scaling-stroke; opacity: .85; }
#map .sl { font: 600 11px var(--f-body); fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
#map .sl-sec, #map .sl-major { font-size: 12px; font-weight: 700; }
#map .sl-ter, #map .sl-ped { font-size: 11.5px; }
#map .sl-ped { font-style: italic; }
#map .sl-foot { font-size: 10px; fill: var(--muted); }
#map .sl.water { font-size: 13px; font-style: italic; font-weight: 600; fill: var(--water-ink); }
#map .route { fill: none; stroke: var(--route); stroke-width: 5px; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; opacity: .8; }
#map .mk circle { stroke: var(--surface); stroke-width: 2px; }
#map .mk circle.hit { stroke: none; fill: transparent; }
#map .mk text { font: 700 calc(11px * var(--k)) var(--f-body); fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-width: 3px; stroke-linejoin: round; }
#map .mk .num { fill: #fff; stroke: none; font-size: calc(11px * var(--k)); font-weight: 800; }
#map .mk .name { display: none; }
#map.labels .mk .name, #map .mk.stop .name, #map .mk.sel .name { display: inline; }
#map .mk.seen { opacity: .5; }
#map .mk.sel circle { stroke: var(--ink); stroke-width: 3px; }
.mapbar { position: absolute; top: 10px; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.mapbar > * { pointer-events: auto; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
.mapbtns { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 14px; display: grid; gap: 6px; }
.mapbtns button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: calc(22px * var(--k)); font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.15); padding: 0; }
.mapbtns svg { width: 20px; height: 20px; }
.mapcard { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); right: 64px; bottom: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
.mapcard .t { font-weight: 800; font-size: calc(15.5px * var(--k)); }
.mapnote { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 14px; font-size: calc(11px * var(--k)); color: var(--muted); background: var(--surface); padding: 3px 7px; border-radius: 6px; opacity: .9; }

/* Info */
.info { display: grid; gap: 18px; max-width: 720px; }
.info section { display: grid; gap: 8px; }
.info p, .info ul { margin: 0; }
.info ul { padding-left: 18px; display: grid; gap: 4px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.kv dt { font-weight: 700; font-variant-numeric: tabular-nums; }
.kv dd { margin: 0; color: var(--muted); }
.trip { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 3px; text-decoration: none; color: var(--ink); }
.trip b { display: flex; justify-content: space-between; gap: 8px; }
.trip span { font-size: calc(13.5px * var(--k)); color: var(--muted); }
.hotelpick { display: grid; gap: 8px; }
.hotelpick label { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.hotelpick input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); }
.hotelpick small { display: block; color: var(--muted); }

.btn { min-height: 44px; }
.btn.small { min-height: 36px; }
.btn.in { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .4; }
.ed { display: grid; gap: 8px; padding-top: 4px; }
.ed p { margin: 0; }
.form input { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: calc(16px * var(--k)); min-height: 46px; }
.check { display: flex; align-items: center; gap: 10px; font-weight: 600; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
/* Info: checklist and forms */
.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.checklist li { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding-left: 12px; }
.checklist label { flex: 1; display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 6px 0; }
.checklist input { width: 24px; height: 24px; flex: none; accent-color: var(--accent); }
.checklist li.on span { color: var(--muted); text-decoration: line-through; }
.checklist .x { border: 0; background: none; width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); padding: 0; }
.checklist .x svg { width: 18px; height: 18px; }
.addck input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 46px; font-size: calc(16px * var(--k)); }
.form { display: grid; gap: 10px; }
.form label { display: grid; gap: 4px; font-weight: 700; font-size: calc(13px * var(--k)); color: var(--muted); }
.form input { color: var(--ink); width: 100%; }
.trip .row { margin-top: 6px; }
.info section { scroll-margin-top: 12px; }

/* Mi viaje: suggestion cards shaped like Georgian doors, coloured by category */
:root { --door-ver: #A8322A; --door-museo: #24508F; --door-calle: #7E5700; --door-parque: #2C6E40; --door-comer: #6B3786; --door-pub: #4E321F; --fan: #F2D38B; }
.trip-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.trip-head .when { display: grid; gap: 2px; }
.trip-head .big-clock { font: 800 calc(34px * var(--k))/1 var(--f-display); font-variant-numeric: tabular-nums; }
.trip-head .day { font-weight: 700; color: var(--muted); }
.lightchip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: calc(13px * var(--k)); white-space: nowrap; }
.lightchip svg { width: 16px; height: 16px; }
.lightchip.night { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fixedrow { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; }
.fixedrow::-webkit-scrollbar { display: none; }
.fixed { flex: none; display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px; text-align: left; max-width: 82%; }
.fixed time { font: 800 calc(19px * var(--k))/1 var(--f-display); font-variant-numeric: tabular-nums; }
.fixed span { font-weight: 600; font-size: calc(14px * var(--k)); line-height: 1.25; }
.fixed.urgent { background: var(--bad-soft); border-color: var(--bad); }
