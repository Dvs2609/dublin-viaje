<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17664E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dublín">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Dublín de bolsillo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one-screen phone app. Header, scrolling view, bottom tab bar. Category colours borrowed from Georgian doors. */
:root {
  --bg: #EDF1F2;
  --surface: #FFFFFF;
  --surface-2: #E3E9EB;
  --ink: #14212A;
  --muted: #566A75;
  --line: #CFD9DD;
  --accent: #17664E;
  --accent-soft: #D6EBE3;
  --on-accent: #FFFFFF;
  --toast-act: #7FE0B8;
  --warn: #A55A00;
  --warn-soft: #FBEBD3;
  --bad: #B0302A;
  --bad-soft: #F7DEDC;
  --good: #1F7A45;
  --c-ver: #B5372B;
  --c-museo: #2A5A9C;
  --c-calle: #B07B0C;
  --c-parque: #3B8A4E;
  --c-comer: #8A4BA6;
  --c-pub: #6A4528;
  --water: #A9CBDD;
  --water-ink: #3C7397;
  --park: #CDE5C3;
  --land: #F2F1EC;
  --street: #FFFFFF;
  --street-edge: #CBCBC4;
  --road-sec: #FBE3A0;
  --road-sec-edge: #D9B860;
  --road-ped: #EBD3E0;
  --tram: #8B4FA6;
  --route: #1E5FD0;
  --campus: #E2E2D6;
  --f-display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 14px;
  --k: 1.07;
}
:root.big { --k: 1.22; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E161B; --surface: #172229; --surface-2: #1F2D35; --ink: #E4ECEF; --muted: #95A8B2; --line: #2C3D46;
    --accent: #4DBB91; --accent-soft: #173B30; --on-accent: #06140F; --toast-act: #0F5A43;
    --warn: #F0A646; --warn-soft: #3A2A12; --bad: #F07A70; --bad-soft: #3D1C1A; --good: #5CCB86;
    --c-ver: #EE7A6C; --c-museo: #7EA8E8; --c-calle: #E2B045; --c-parque: #6FC283; --c-comer: #C38BDE; --c-pub: #C79A72;
    --water: #24546D; --water-ink: #8CC0DE; --park: #1C3427; --land: #10181C; --street: #3A4A53; --street-edge: #1A252B; --road-sec: #6B5C2E; --road-sec-edge: #2E2814; --road-ped: #3F3A45; --tram: #C08BDE; --route: #6FA4FF; --campus: #252F2B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E161B; --surface: #172229; --surface-2: #1F2D35; --ink: #E4ECEF; --muted: #95A8B2; --line: #2C3D46;
  --accent: #4DBB91; --accent-soft: #173B30; --on-accent: #06140F; --toast-act: #0F5A43;
  --warn: #F0A646; --warn-soft: #3A2A12; --bad: #F07A70; --bad-soft: #3D1C1A; --good: #5CCB86;
  --c-ver: #EE7A6C; --c-museo: #7EA8E8; --c-calle: #E2B045; --c-parque: #6FC283; --c-comer: #C38BDE; --c-pub: #C79A72;
  --water: #24546D; --water-ink: #8CC0DE; --park: #1C3427; --land: #10181C; --street: #3A4A53; --street-edge: #1A252B; --road-sec: #6B5C2E; --road-sec-edge: #2E2814; --road-ped: #3F3A45; --tram: #C08BDE; --route: #6FA4FF; --campus: #252F2B;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: calc(15px * var(--k))/1.45 var(--f-body);
  display: flex; flex-direction: column; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px 10px; display: flex; align-items: center; gap: 12px; }
.brand { flex: 1; min-width: 0; }
.brand h1 { margin: 0; font: 800 21px/1.05 var(--f-display); letter-spacing: -0.01em; }
.brand small { display: block; color: var(--muted); font-size: calc(12px * var(--k)); margin-top: 2px; }
.netpill { font-size: calc(11px * var(--k)); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 4px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.netpill.on { background: var(--accent-soft); color: var(--accent); }

main { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; -webkit-overflow-scrolling: touch; }
.view { padding-block: 14px 28px; }
.view[hidden] { display: none !important; }

/* Bottom tabs */
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs button { background: none; border: 0; padding: 8px 4px 9px; display: grid; justify-items: center; gap: 2px; color: var(--muted); font-size: calc(12px * var(--k)); font-weight: 600; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button { min-height: 56px; }
.tabs button[aria-selected="true"] { color: var(--accent); }

/* Common bits */
.h2 { font: 800 calc(19px * var(--k))/1.15 var(--f-display); margin: 0 0 8px; text-wrap: balance; }
.label { font-size: calc(11px * var(--k)); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 10px; font-weight: 600; font-size: calc(14px * var(--k)); display: inline-flex; gap: 6px; align-items: center; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { padding: 5px 9px; font-size: calc(13px * var(--k)); }
.btn svg { width: 16px; height: 16px; flex: none; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 6px 11px; border-radius: 99px; font-size: calc(13px * var(--k)); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); padding: 3px; border-radius: 11px; gap: 3px; }
.seg button { border: 0; background: none; padding: 7px 6px; border-radius: 8px; font-weight: 700; font-size: calc(14px * var(--k)); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.banner { background: var(--warn-soft); color: var(--ink); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; margin-bottom: 14px; }
.banner b { color: var(--warn); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: calc(12px * var(--k)); font-weight: 700; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
.pill.good { background: var(--accent-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.neutral { background: var(--surface-2); color: var(--muted); }
.district { font: 700 calc(11px * var(--k))/1 var(--f-body); letter-spacing: .04em; border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; color: var(--muted); }

/* Explore */
.search { position: relative; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 40px 12px 40px; font-size: calc(16px * var(--k)); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; padding: 8px; color: var(--muted); font-size: calc(18px * var(--k)); line-height: 1; }
.explore-tools { display: grid; gap: 10px; margin-bottom: 12px; }
.refline { font-size: calc(13px * var(--k)); color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.refline select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 6px; font-size: calc(13px * var(--k)); font-weight: 600; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid; grid-template-columns: 4px 1fr auto; overflow: hidden; }
.item .bar { background: var(--c); }
.item-main { padding: 10px 10px 10px 12px; min-width: 0; background: none; border: 0; text-align: left; }
.item-name { font-weight: 700; font-size: calc(15.5px * var(--k)); line-height: 1.25; }
.item-meta { font-size: calc(12.5px * var(--k)); color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.item-side { display: grid; align-content: center; justify-items: end; gap: 5px; padding: 8px 10px 8px 0; }
.walk { font-size: calc(12.5px * var(--k)); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.add { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: calc(20px * var(--k)); line-height: 1; font-weight: 600; display: grid; place-items: center; padding: 0; }
.add svg { width: 20px; height: 20px; }
.add.in { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-size: calc(13px * var(--k)); font-weight: 800; width: auto; padding: 0 9px; gap: 3px; display: inline-flex; }
.add.in svg { width: 15px; height: 15px; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }

/* Detail sheet */
.sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet[hidden] { display: none !important; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding-block: 8px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet-head .x { border: 0; background: var(--surface-2); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; padding: 0; flex: none; }
.sheet-head .x svg { width: 20px; height: 20px; }
.sheet-body { flex: 1; overflow-y: auto; padding-block: 16px 30px; display: flex; flex-direction: column; gap: 16px; }
.sheet-body > * { flex-shrink: 0; }
.d-cat { display: flex; gap: 8px; align-items: center; font-size: calc(13px * var(--k)); color: var(--muted); font-weight: 600; }
.d-title { font: 800 calc(26px * var(--k))/1.08 var(--f-display); margin: 4px 0 0; letter-spacing: -0.01em; text-wrap: balance; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.facts div { background: var(--surface); padding: 9px 10px; min-width: 0; }
.facts b { display: block; font-size: calc(15px * var(--k)); font-variant-numeric: tabular-nums; }
.facts small { display: block; font-size: calc(11.5px * var(--k)); margin-top: 1px; }
.facts span { font-size: calc(11px * var(--k)); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.prose { margin: 0; max-width: 65ch; }
.tipbox { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; }
.addrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.addrow .btn { justify-content: center; }
.addrow .btn.in { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.links { display: grid; gap: 8px; }
.links a { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; text-decoration: none; color: var(--ink); font-weight: 600; }
.links a small { color: var(--muted); font-weight: 500; }
.near { display: grid; gap: 6px; }
.near button { display: flex; align-items: center; gap: 8px; border: 0; background: var(--surface); border-radius: 10px; padding: 9px 10px; text-align: left; }
.near button span.n { flex: 1; font-weight: 600; min-width: 0; }

/* Plan */
.plan-head { display: grid; gap: 10px; margin-bottom: 12px; }
.day-note { font-size: calc(13.5px * var(--k)); color: var(--muted); margin: 0; }
.settings { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.settings label { display: grid; gap: 3px; font-size: calc(12px * var(--k)); color: var(--muted); font-weight: 700; }
.settings input[type="time"], .settings select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 8px; font-size: calc(15px * var(--k)); font-weight: 600; color: var(--ink); width: 100%; }
.settings .check { display: flex; align-items: center; gap: 8px; font-size: calc(14px * var(--k)); color: var(--ink); font-weight: 600; grid-column: 1 / -1; }
.settings .check input { width: 20px; height: 20px; accent-color: var(--accent); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.actions .btn { padding: 7px 10px; font-size: calc(13.5px * var(--k)); }
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl::before { content: ""; position: absolute; left: 17px; top: 14px; bottom: 14px; width: 2px; background: var(--line); }
.tl li { position: relative; }
.tl-node { display: flex; gap: 12px; align-items: center; padding: 6px 0; }
.tl-node .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 800; flex: none; z-index: 1; }
.tl-node time, .tl-stop time { font-variant-numeric: tabular-nums; font-weight: 800; }
.tl-walk { padding: 2px 0 2px 48px; font-size: calc(12.5px * var(--k)); color: var(--muted); display: flex; gap: 6px; align-items: center; min-height: 26px; flex-wrap: wrap; }
.tl-walk svg { width: 14px; height: 14px; }
.tl-walk .far { color: var(--warn); font-weight: 700; }
.tl-sun { padding: 4px 0 4px 48px; font-size: calc(12.5px * var(--k)); font-weight: 700; color: var(--warn); display: flex; align-items: center; gap: 6px; }
.tl-sun::before { content: ""; position: absolute; left: 12px; width: 12px; height: 12px; border-radius: 50%; background: var(--warn); }
.tl-stop { display: grid; grid-template-columns: 36px 1fr; gap: 12px; padding: 4px 0; }
.tl-stop .num { width: 36px; height: 36px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 800; z-index: 1; border: 3px solid var(--bg); }
.tl-stop.done .num { background: var(--muted); }
.tl-stop.done .card { opacity: .6; }
.tl-stop.done .sname { text-decoration: line-through; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.card .r1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; font-size: calc(13px * var(--k)); }
.sname { font-weight: 700; font-size: calc(15.5px * var(--k)); background: none; border: 0; padding: 0; text-align: left; line-height: 1.25; }
.ctrl { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.ctrl button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; min-width: 32px; height: 32px; padding: 0 6px; font-weight: 700; display: grid; place-items: center; }
.ctrl button svg { width: 16px; height: 16px; }
.ctrl .durv { font-size: calc(13px * var(--k)); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 46px; text-align: center; }
.ctrl .sp { flex: 1; }
.ctrl button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.totals { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; text-align: center; }
.totals b { display: block; font: 800 calc(19px * var(--k))/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.totals span { font-size: calc(11px * var(--k)); color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.limitmsg { margin-top: 8px; }
.tpl { display: grid; gap: 8px; margin-top: 8px; }
.tpl-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 4px; }
.tpl-item p { margin: 0; font-size: calc(13.5px * var(--k)); color: var(--muted); }
details.box > summary { cursor: pointer; font-weight: 700; padding: 10px 0; list-style: none; display: flex; align-items: center; gap: 8px; }
details.box > summary::-webkit-details-marker { display: none; }
details.box > summary::before { content: "+"; width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; font-weight: 800; }
details.box[open] > summary::before { content: "−"; }
textarea { width: 100%; min-height: 80px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px; font-size: calc(15px * var(--k)); resize: vertical; }

/* Map */
#view-map { position: absolute; inset: 0; padding: 0; }
#map { width: 100%; height: 100%; display: block; touch-action: none; background: var(--land); user-select: none; -webkit-user-select: none; }
#map .river { fill: none; stroke: var(--water); stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
#map .canal { fill: none; stroke: var(--water); vector-effect: non-scaling-stroke; stroke-linecap: round; }
#map .park { fill: var(--park); }
#map .rd-edge, #map .rd { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
#map .rd-edge { stroke: var(--street-edge); }
#map .rd { stroke: var(--street); }
#map .rd-sec { stroke: var(--road-sec); }
#map .rd-major { stroke: var(--road-sec); }
#map .rd-ped { stroke: var(--road-ped); }
#map .rd-foot { stroke: var(--road-ped); }
#map .rd-edge.rd-foot { stroke: none; }
#map .rd-edge.rd-sec, #map .rd-edge.rd-major { stroke: var(--road-sec-edge); }
#map .tram { fill: none; stroke: var(--tram); stroke-width: 2px; stroke-dasharray: 7 4; vector-effect: non-scaling-stroke; opacity: .85; }
#map .sl { font: 600 11px var(--f-body); fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
#map .sl-sec, #map .sl-major { font-size: 12px; font-weight: 700; }
#map .sl-ter, #map .sl-ped { font-size: 11.5px; }
#map .sl-ped { font-style: italic; }
#map .sl-foot { font-size: 10px; fill: var(--muted); }
#map .sl.water { font-size: 13px; font-style: italic; font-weight: 600; fill: var(--water-ink); }
#map .route { fill: none; stroke: var(--route); stroke-width: 5px; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; opacity: .8; }
#map .mk circle { stroke: var(--surface); stroke-width: 2px; }
#map .mk circle.hit { stroke: none; fill: transparent; }
#map .mk text { font: 700 calc(11px * var(--k)) var(--f-body); fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-width: 3px; stroke-linejoin: round; }
#map .mk .num { fill: #fff; stroke: none; font-size: calc(11px * var(--k)); font-weight: 800; }
#map .mk .name { display: none; }
#map.labels .mk .name, #map .mk.stop .name, #map .mk.sel .name { display: inline; }
#map .mk.dim { opacity: .35; }
#map .mk.sel circle { stroke: var(--ink); stroke-width: 3px; }

function searchText(p) {

const WORD_FILTERS = { gratis: p => p.free, gratuito: p => p.free, free: p => p.free, lluvia: p => !p.out, llueve: p => !p.out, cubierto: p => !p.out };
function score(p, q) {
  if (!q) return 1;
  const n = norm(p.n), k = searchText(p), body = norm(p.t + ' ' + p.tip);
  let sc = 0;
  for (const w of q.split(/\s+/).filter(Boolean)) {
    if (WORD_FILTERS[w]) { if (!WORD_FILTERS[w](p)) return 0; sc += 1; continue; }
    let s = 0;
    if (n.startsWith(w)) s = 10; else if (n.includes(w)) s = 7; else if (k.includes(w)) s = 5; else if (body.includes(w)) s = 2;
    if (!s) return 0;

  }

}

// Export format DUBLIN1: stops are [id, dur, done] plus an optional 4th element with the newer fields.
function packPlan() {
  const o = { v: 1, h: S.hotel, d: {}, c: S.checklist.map(c => [c.text, c.checked ? 1 : 0]), e: S.excursion };
  for (const k of DAYKEYS) {
    const d = S.days[k];
    o.d[k] = { s: d.start, f: d.from, b: d.back ? 1 : 0, l: d.limit, n: d.notes, x: d.stops.map(s => {
      const extra = {};
      if (s.skipped) extra.k = 1;
      if (s.reservedAt) extra.r = s.reservedAt;
      if (s.ticketBought) extra.t = 1;
      if (s.note) extra.n = s.note;
      return Object.keys(extra).length ? [s.id, s.dur, s.done ? 1 : 0, extra] : [s.id, s.dur, s.done ? 1 : 0];
    }) };
  }

}
function unpackPlan(txt) {
  const m = /DUBLIN1:([A-Za-z0-9+/=]+)/.exec(txt || '');
  if (!m) throw new Error('code');
  const o = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
  if (!o || typeof o !== 'object') throw new Error('code');
  const days = {}, def = emptyDays();
  for (const k of DAYKEYS) {
    const x = (o.d || {})[k] || {};
    days[k] = { start: toMin(x.s) !== null ? x.s : def[k].start, from: x.f === 'gps' ? 'gps' : 'hotel', back: x.b !== 0, limit: typeof x.l === 'string' ? x.l : def[k].limit, notes: String(x.n || '').slice(0, 2000),
      stops: (Array.isArray(x.x) ? x.x : []).filter(s => Array.isArray(s) && BYID[s[0]]).map(s => {
        const e = s[3] && typeof s[3] === 'object' ? s[3] : {};
        return normStop({ id: s[0], dur: +s[1], done: !!s[2], skipped: !!e.k, reservedAt: e.r, ticketBought: !!e.t, note: e.n });
      }) };
  }
  const out = { hotel: HOTELS[o.h] ? o.h : S.hotel, days };
  if (Array.isArray(o.c)) out.checklist = o.c.filter(c => Array.isArray(c) && c[0]).slice(0, 60).map(c => ({ id: uid(), text: String(c[0]).slice(0, 200), checked: !!c[1] }));
  if (o.e) out.excursion = normExcursion(o.e);
  return out;
}

// ---------- GPS ----------
let watchId = null, gpsWaiters = [];
function startGPS(cb) {
  if (cb) gpsWaiters.push(cb);
  if (!navigator.geolocation) { toast('Este navegador no da la posición'); return; }
  if (watchId !== null) { if (GPS) flushGPS(); return; }
  try {
    watchId = navigator.geolocation.watchPosition(pos => {
      const prev = GPS;
      GPS = { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy };
      flushGPS();
      if (!prev || dist(prev, GPS) > 25) onGPSMove();
    }, () => {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = null; gpsWaiters = [];
      toast('No se pudo saber dónde estás. Revisa el permiso de ubicación.');
    }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 25000 });
  } catch (e) { watchId = null; toast('No se pudo saber dónde estás'); }
}
function flushGPS() { const w = gpsWaiters; gpsWaiters = []; w.forEach(f => f()); }
function onGPSMove() {
  if (!gpsInDublin()) { toast('Estás lejos de Dublín: las distancias se miden desde el hotel'); return; }
  renderAll();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, i = +el.dataset.i, v = +el.dataset.v;
  const d = S.days[S.day];
  switch (a) {
    case 'open': openDetail(id); break;
    case 'edit': { const dk = el.dataset.day, s = S.days[dk].stops[i]; if (s) openSheet({ kind: 'stop', dk, id: s.id }); break; }
    case 'add': toggleStop(id, el.dataset.day || S.day); break;
    case 'cat': S.cat = id; save(); renderCats(); renderList(); break;
    case 'sort':
      S.sort = id; save();
      if (id === 'near') { toast('Buscando dónde estás…'); startGPS(renderList); }
      renderExplore(); break;
    case 'day': S.day = el.dataset.day; save(); renderAll(); break;
    case 'goplan': S.day = el.dataset.day; setTab('plan'); break;
    case 'goto': closeDetail(false, () => gotoSection(id)); break;
    case 'addmore': setTab('explore'); break;
    case 'nearme': S.sort = 'near'; S.cat = 'all'; setTab('explore'); startGPS(renderList); break;
    case 'text': S.largeText = id === '1'; save(); applyText(); renderInfo(); break;
    case 'harrive': case 'hleft': {
      const s = S.days[el.dataset.day].stops[i];
      if (!s) break;
      s.arrivedAt = a === 'harrive' ? fromMin(nowMin()) : '';
      save(); renderAll();
      break;
    }
    case 'hdone': case 'hskip': {
      const s = S.days[el.dataset.day].stops[i];
      if (!s) break;
      snapshot();
      if (a === 'hdone') s.done = true; else s.skipped = true;
      save(); renderAll();
      toast(a === 'hdone' ? `Hecho: ${BYID[s.id].n}` : `Saltada: ${BYID[s.id].n}`, 'Deshacer', restore);
      break;
    }
    // Stop editor
    case 'edur': editStop(s => { s.dur = clampDur(v); }); break;
    case 'edurd': editStop(s => { s.dur = clampDur(s.dur + v); }); break;
    case 'eresclear': editStop(s => { s.reservedAt = ''; }); break;
    case 'emv': editStop((s, dd) => { const k = dd.stops.indexOf(s), j = k + v; if (j >= 0 && j < dd.stops.length) [dd.stops[k], dd.stops[j]] = [dd.stops[j], dd.stops[k]]; }); break;
    case 'edone': editStop(s => { s.done = !s.done; if (s.done) s.skipped = false; }); break;
    case 'eskip': editStop(s => { s.skipped = !s.skipped; if (s.skipped) s.done = false; }); break;
    case 'emoveday': {
      const from = S.days[sheet.dk], to = S.days[el.dataset.day], k = from.stops.findIndex(s => s.id === sheet.id);
      if (k < 0) break;
      if (to.stops.some(x => x.id === sheet.id)) { toast(`Este sitio ya está en el plan del ${dayName(el.dataset.day)}`); break; }
      snapshot();
      to.stops.push(from.stops.splice(k, 1)[0]);
      save(); closeDetail();
      toast(`Pasado al ${dayName(el.dataset.day)}`, 'Deshacer', restore);
      break;
    }
    case 'edel': {
      const from = S.days[sheet.dk], k = from.stops.findIndex(s => s.id === sheet.id);
      if (k < 0) break;
      snapshot(); from.stops.splice(k, 1); save(); closeDetail();
      toast('Parada quitada', 'Deshacer', restore);
      break;
    }
    case 'opt': optimize(S.day); break;
    case 'tpl': loadTemplate(S.day, i, false); break;
    case 'tpladd': loadTemplate(S.day, i, true); break;
    case 'clear': snapshot(); d.stops = []; save(); renderPlan(); toast('Día vaciado', 'Deshacer', restore); break;
    case 'mapday': showMap(null, S.day); break;
    case 'mapfocus': closeDetail(false, () => showMap(id)); break;
    case 'mapmode': S.mapMode = el.dataset.day; save(); showMap(null, S.mapMode); break;
    case 'mapclose': selectOnMap(null); break;
    case 'ckdel': S.checklist = S.checklist.filter(c => c.id !== id); save(); renderInfo(); break;
    case 'pickexc': { const t = TRIPS[i]; S.excursion = { ...S.excursion, name: t.n, url: t.u }; save(); renderInfo(); toast('Excursión apuntada'); break; }
    case 'export': {
      const code = packPlan(), io = $('#io');
      io.value = code;
      const sel = () => { io.focus(); io.select(); toast('Código seleccionado: cópialo'); };
      try { navigator.clipboard.writeText(code).then(() => toast('Código copiado'), sel); } catch (err) { sel(); }
      break;
    }
    case 'share': navigator.share({ title: 'Plan Dublín', text: packPlan() }).catch(() => {}); break;
    case 'import': {
      try {
        const r = unpackPlan($('#io').value);
        snapshot();
        S.days = r.days; S.hotel = r.hotel;
        if (r.checklist) S.checklist = r.checklist;
        if (r.excursion) S.excursion = r.excursion;
        save(); renderInfo(); toast('Plan importado', 'Deshacer', restore);
      } catch (err) { toast('Ese texto no es un código de plan válido. Debe empezar por DUBLIN1:'); }
      break;
    }
    case 'reset':
      if (el.dataset.armed) { snapshot(); S.days = defState(true).days; save(); renderInfo(); toast('Plan inicial recuperado', 'Deshacer', restore); }
      else { el.dataset.armed = '1'; el.textContent = 'Pulsa otra vez para confirmar'; el.classList.add('danger'); }
      break;
  }
});
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) setTab(b.dataset.tab); });
$('#q').addEventListener('input', renderList);
$('#q-clear').addEventListener('click', () => { $('#q').value = ''; renderList(); $('#q').focus(); });
$('#sheet-close').addEventListener('click', () => closeDetail());
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
$('#sheet-body').addEventListener('change', e => {
  if (!sheet || sheet.kind !== 'stop') return;
  if (e.target.id === 'e-res') editStop(s => { s.reservedAt = toMin(e.target.value) !== null ? e.target.value : ''; });
  else if (e.target.id === 'e-ticket') editStop(s => { s.ticketBought = e.target.checked; });
});
$('#sheet-body').addEventListener('input', e => {
  if (e.target.id !== 'e-note' || !sheet) return;
  const s = S.days[sheet.dk].stops.find(x => x.id === sheet.id);
  if (s) { s.note = e.target.value.slice(0, 500); save(); }
});
$('#view-plan').addEventListener('change', e => {
  const d = S.days[S.day], t = e.target;
  if (t.id === 'p-start' && toMin(t.value) !== null) d.start = t.value;
  else if (t.id === 'p-limit') d.limit = t.value;
  else if (t.id === 'p-back') d.back = t.checked;
  else if (t.id === 'p-from') { d.from = t.value; if (t.value === 'gps') startGPS(renderPlan); }
  else return;
  save(); renderPlan();
});
$('#view-plan').addEventListener('input', e => { if (e.target.id === 'p-notes') { S.days[S.day].notes = e.target.value; save(); } });
$('#view-info').addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'hotel') { S.hotel = t.value; save(); toast(`Hotel: ${HOTELS[S.hotel].name}`); return; }
  if (t.dataset.ck) { const c = S.checklist.find(x => x.id === t.dataset.ck); if (c) { c.checked = t.checked; save(); renderInfo(); const el = document.getElementById('ck-' + c.id); if (el) el.focus(); } return; }
  const ex = S.excursion;
  if (t.id === 'x-name') ex.name = t.value.slice(0, 120);
  else if (t.id === 'x-time') ex.time = toMin(t.value) !== null ? t.value : '';
  else if (t.id === 'x-meet') ex.meetingPoint = t.value.slice(0, 200);
  else if (t.id === 'x-url') { ex.url = safeUrl(t.value); if (t.value && !ex.url) toast('El enlace debe empezar por https://'); }
  else return;
  save();
});
$('#view-info').addEventListener('submit', e => {
  if (e.target.id !== 'ck-form') return;
  e.preventDefault();
  const v = $('#ck-new').value.trim();
  if (!v) return;
  S.checklist.push({ id: uid(), text: v.slice(0, 200), checked: false });
  save(); renderInfo();
  $('#ck-new').focus();
});
$('#zin').addEventListener('click', () => { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.5); });
$('#zout').addEventListener('click', () => { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.5); });
$('#zhotel').addEventListener('click', () => { const h = hotelPt(); centerOn(h.lat, h.lon, 1600); });
$('#zgps').addEventListener('click', () => {
  toast('Buscando dónde estás…');
  startGPS(() => { if (!gpsInDublin()) { toast('Estás lejos de Dublín'); return; } renderMarkers(); centerOn(GPS.lat, GPS.lon, 1200); });
});
window.addEventListener('online', renderNet);
window.addEventListener('offline', renderNet);
// Hoy depends on the clock: refresh it every minute while visible.
setInterval(() => { if (S.tab === 'today' && $('#sheet').hidden && !document.hidden) renderToday(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.tab === 'today') renderToday(); });

// ---------- Boot ----------
const S = load();
(function boot() {
  applyText();
  const fromHash = Object.entries(TAB_HASH).find(([, h]) => '#' + h === location.hash);
  setTab(fromHash ? fromHash[0] : 'today');
  renderNet();
  if (S.sort === 'near' || DAYKEYS.some(k => S.days[k].from === 'gps') || todayKey()) startGPS();
  save();
  if (PWA && 'serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(renderNet).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', renderNet);
  }
})();

</script>
